# Deploy marketing site (site/) → Cloudflare Pages → honestspend.net
#
# Triggers when site assets change on main, or manually.
# Secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   — Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id

name: Deploy site (Cloudflare Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy site/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=honestspend --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
