name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version label for artifact name"
        required: false
        default: "manual"

permissions:
  contents: write

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

  winui-publish:
    needs: python-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish WinUI (win-x64 self-contained)
        shell: pwsh
        run: |
          $Out = Join-Path $env:GITHUB_WORKSPACE "dist/LedgerRing.WinUI-win-x64"
          New-Item -ItemType Directory -Force -Path $Out | Out-Null
          dotnet publish clients/LedgerRing.WinUI/LedgerRing.WinUI.csproj `
            -c Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:PublishReadyToRun=true `
            -o $Out
      - name: Stage release folder notes
        shell: pwsh
        run: |
          $Out = Join-Path $env:GITHUB_WORKSPACE "dist/LedgerRing.WinUI-win-x64"
          Copy-Item docs/INSTALL.md $Out -Force -ErrorAction SilentlyContinue
          Copy-Item LICENSE $Out -Force -ErrorAction SilentlyContinue
          Copy-Item CHANGELOG.md $Out -Force -ErrorAction SilentlyContinue
          @"
          LedgerRing WinUI (self-contained)
          ---------------------------------
          This zip is the UI only. For a full offline package with Python engine:
            run scripts/package-release.ps1 on a dev machine, or
            point Settings → Backend root at a clone with .venv.

          Install notes: INSTALL.md
          "@ | Set-Content (Join-Path $Out "README-RELEASE.txt")
      - name: Zip WinUI
        shell: pwsh
        run: |
          $Out = Join-Path $env:GITHUB_WORKSPACE "dist/LedgerRing.WinUI-win-x64"
          $Zip = Join-Path $env:GITHUB_WORKSPACE "dist/LedgerRing.WinUI-win-x64.zip"
          if (Test-Path $Zip) { Remove-Item $Zip -Force }
          Compress-Archive -Path (Join-Path $Out "*") -DestinationPath $Zip
      - name: Upload WinUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: LedgerRing.WinUI-win-x64
          path: dist/LedgerRing.WinUI-win-x64.zip

  python-sdist:
    needs: python-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist/wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload Python dist
        uses: actions/upload-artifact@v4
        with:
          name: LedgerRing-python-dist
          path: dist/*

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [winui-publish, python-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            artifacts/LedgerRing.WinUI-win-x64/LedgerRing.WinUI-win-x64.zip
            artifacts/LedgerRing-python-dist/*
            docs/INSTALL.md
            docs/AUTOMATION.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
