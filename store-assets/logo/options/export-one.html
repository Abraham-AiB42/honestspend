<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Single 300x300 export: open with ?opt=a|b|c|d|e|f|g|h|i -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 300px; height: 300px; overflow: hidden; background: transparent; }
  .tile { width: 300px; height: 300px; position: relative; font-family: "Segoe UI", Arial, sans-serif; }

  .a { background: #0078D4; display: grid; place-items: center; }
  .a .letter { color: #fff; font-size: 168px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; }

  .b { background: linear-gradient(145deg, #3d9cf0 0%, #1565c0 55%, #0d47a1 100%); border-radius: 66px; display: grid; place-items: center; }
  .b .letter { color: #fff; font-size: 160px; font-weight: 800; line-height: 1; letter-spacing: -0.05em; text-shadow: 0 4px 20px rgba(0,0,0,0.2); }

  .c { background: #1a2332; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .c .letter { color: #f0f4f8; font-size: 148px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
  .c .bar { width: 120px; height: 12px; border-radius: 6px; background: #3ecf8e; }

  .d { background: #0c1118; display: grid; place-items: center; }
  .d .circle { width: 230px; height: 230px; border-radius: 50%; background: linear-gradient(160deg, #4dabf7, #1971c2); display: grid; place-items: center; box-shadow: 0 12px 40px rgba(25,113,194,0.45); }
  .d .letter { color: #fff; font-size: 132px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }

  .e { background: #0f172a; display: grid; place-items: center; }
  .e .mono { font-size: 110px; font-weight: 800; letter-spacing: -0.08em; line-height: 1; background: linear-gradient(120deg, #74c0fc, #3d9cf0 40%, #3ecf8e); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .f { background: #ffffff; display: grid; place-items: center; }
  .f .frame { width: 210px; height: 210px; border: 14px solid #0078D4; border-radius: 48px; display: grid; place-items: center; }
  .f .letter { color: #0078D4; font-size: 128px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }

  .g { background: linear-gradient(160deg, #e6fcf5 0%, #c3fae8 100%); display: grid; place-items: center; }
  .g .letter { color: #087f5b; font-size: 168px; font-weight: 800; line-height: 1; letter-spacing: -0.05em; }

  .h { background: #0b1f3a; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .h .letter { color: #fff; font-size: 140px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
  .h .check { margin-top: 6px; width: 72px; height: 36px; }
  .h .check path { fill: none; stroke: #fcc419; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }

  .i { background: #e8eef5; display: grid; place-items: center; }
  .i .squircle { width: 260px; height: 260px; border-radius: 58px; background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%); display: grid; place-items: center; box-shadow: 0 8px 0 #1d4ed8; }
  .i .letter { color: #fff; font-size: 148px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const opt = (new URLSearchParams(location.search).get('opt') || 'a').toLowerCase();
  const map = {
    a: '<div class="tile a"><span class="letter">H</span></div>',
    b: '<div class="tile b"><span class="letter">H</span></div>',
    c: '<div class="tile c"><span class="letter">H</span><span class="bar"></span></div>',
    d: '<div class="tile d"><div class="circle"><span class="letter">H</span></div></div>',
    e: '<div class="tile e"><span class="mono">HS</span></div>',
    f: '<div class="tile f"><div class="frame"><span class="letter">H</span></div></div>',
    g: '<div class="tile g"><span class="letter">H</span></div>',
    h: '<div class="tile h"><span class="letter">H</span><svg class="check" viewBox="0 0 72 36"><path d="M8 18 L28 30 L64 6"/></svg></div>',
    i: '<div class="tile i"><div class="squircle"><span class="letter">H</span></div></div>',
  };
  document.getElementById('root').innerHTML = map[opt] || map.a;
</script>
</body>
</html>
