<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  .icon {
    width: 512px; height: 512px;
    border-radius: 112px;
    background: linear-gradient(145deg, #3d9cf0 0%, #1e5a9e 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  .h {
    color: #fff; font-size: 260px; font-weight: 800;
    line-height: 0.9; letter-spacing: -0.04em;
  }
  .bar {
    width: 200px; height: 18px; border-radius: 9px;
    background: #fff; margin-top: 8px; position: relative;
  }
  .check {
    position: absolute; right: -28px; top: -14px;
    width: 44px; height: 44px;
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="h">H</div>
    <div class="bar">
      <svg class="check" viewBox="0 0 44 44" fill="none">
        <path d="M8 22 L18 32 L36 10" stroke="#3ecf8e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
