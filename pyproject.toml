[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerring"
version = "0.6.0"
description = "LedgerRing — open-source liquidity cockpit for small business owners (IFPP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "LedgerRing contributors" }]
keywords = ["finance", "budget", "small-business", "s-corp", "liquidity", "opensource"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dateutil>=2.9.0",
  "httpx>=0.28.0",
  "openpyxl>=3.1.5",
  "python-multipart>=0.0.12",
  "pystray>=0.19.5",
  "pillow>=10.0.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
financial-os = "financial_os.cli:main"
ledgerring = "financial_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
financial_os = ["data/*.json", "data/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
